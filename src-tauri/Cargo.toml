[package]
name = "panic-button"
version = "0.1.0"
description = "A wildly overproduced emergency command center for mundane problems."
authors = ["Hidden Canopy"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "panic_button_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8.0", features = [] }
tauri-plugin-global-shortcut = "2.3.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
